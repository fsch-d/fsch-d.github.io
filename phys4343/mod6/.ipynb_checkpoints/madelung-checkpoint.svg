<svg viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .orbital-box { stroke: #333; stroke-width: 1; }
      .s-orbital { fill: #b3d9ff; }
      .p-orbital { fill: #ffb3d9; }
      .d-orbital { fill: #ffffb3; }
      .f-orbital { fill: #d9ffb3; }
      .orbital-text { 
        font-size: 20px; 
        font-weight: bold; 
        font-family: Arial, sans-serif; 
        text-anchor: middle;
      }
      .arrow {
        stroke: #333;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrowhead);
      }
      .arrow2 {
        stroke: #333;
        stroke-width: 6;
        fill: #ff0000;
        marker-end: url(#arrowhead);
      }
      .dashed-line {
        stroke: #666;
        stroke-width: 2;
        stroke-dasharray: 8,4;
        fill: none;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>
  
  <!-- Diagonal arrows from top-right to bottom-left at 45 degrees -->
  <!-- Arrow 1: starts from top-right of 1s -->
  <path d="M 190 55 L 70 145" class="arrow"/>
  <path d="M 250 100 L 70 235" class="arrow"/>
  <path d="M 310 145 L 70 325" class="arrow"/>
  <path d="M 370 190 L 70 415" class="arrow"/>
  <path d="M 430 235 L 70 505" class="arrow"/>
  <path d="M 490 280 L 70 595" class="arrow"/>
  <path d="M 550 325 L 70 685" class="arrow"/>
  <path d="M 550 415 L 190 685" class="arrow"/>

  <path d="M 210 55 L 570 325" class="arrow2"/>
  
    
  <!-- Row 1: 1s -->
  <rect x="100" y="60" width="70" height="70" rx="35" class="orbital-box s-orbital"/>
  <text x="135" y="102" class="orbital-text">1s</text>
  
  <!-- Row 2: 2s, 2p -->
  <rect x="100" y="150" width="70" height="70" rx="35" class="orbital-box s-orbital"/>
  <text x="135" y="192" class="orbital-text">2s</text>
  
  <rect x="220" y="150" width="70" height="70" rx="35" class="orbital-box p-orbital"/>
  <text x="255" y="192" class="orbital-text">2p</text>
  
  <!-- Row 3: 3s, 3p, 3d -->
  <rect x="100" y="240" width="70" height="70" rx="35" class="orbital-box s-orbital"/>
  <text x="135" y="282" class="orbital-text">3s</text>
  
  <rect x="220" y="240" width="70" height="70" rx="35" class="orbital-box p-orbital"/>
  <text x="255" y="282" class="orbital-text">3p</text>
  
  <rect x="340" y="240" width="70" height="70" rx="35" class="orbital-box d-orbital"/>
  <text x="375" y="282" class="orbital-text">3d</text>
  
  <!-- Row 4: 4s, 4p, 4d, 4f -->
  <rect x="100" y="330" width="70" height="70" rx="35" class="orbital-box s-orbital"/>
  <text x="135" y="372" class="orbital-text">4s</text>
  
  <rect x="220" y="330" width="70" height="70" rx="35" class="orbital-box p-orbital"/>
  <text x="255" y="372" class="orbital-text">4p</text>
  
  <rect x="340" y="330" width="70" height="70" rx="35" class="orbital-box d-orbital"/>
  <text x="375" y="372" class="orbital-text">4d</text>
  
  <rect x="460" y="330" width="70" height="70" rx="35" class="orbital-box f-orbital"/>
  <text x="495" y="372" class="orbital-text">4f</text>
  
  <!-- Row 5: 5s, 5p, 5d, 5f -->
  <rect x="100" y="420" width="70" height="70" rx="35" class="orbital-box s-orbital"/>
  <text x="135" y="462" class="orbital-text">5s</text>
  
  <rect x="220" y="420" width="70" height="70" rx="35" class="orbital-box p-orbital"/>
  <text x="255" y="462" class="orbital-text">5p</text>
  
  <rect x="340" y="420" width="70" height="70" rx="35" class="orbital-box d-orbital"/>
  <text x="375" y="462" class="orbital-text">5d</text>
  
  <rect x="460" y="420" width="70" height="70" rx="35" class="orbital-box f-orbital"/>
  <text x="495" y="462" class="orbital-text">5f</text>
  
  <!-- Row 6: 6s, 6p, 6d -->
  <rect x="100" y="510" width="70" height="70" rx="35" class="orbital-box s-orbital"/>
  <text x="135" y="552" class="orbital-text">6s</text>
  
  <rect x="220" y="510" width="70" height="70" rx="35" class="orbital-box p-orbital"/>
  <text x="255" y="552" class="orbital-text">6p</text>
  
  <rect x="340" y="510" width="70" height="70" rx="35" class="orbital-box d-orbital"/>
  <text x="375" y="552" class="orbital-text">6d</text>
  
  <!-- Row 7: 7s, 7p -->
  <rect x="100" y="600" width="70" height="70" rx="35" class="orbital-box s-orbital"/>
  <text x="135" y="642" class="orbital-text">7s</text>
  
  <rect x="220" y="600" width="70" height="70" rx="35" class="orbital-box p-orbital"/>
  <text x="255" y="642" class="orbital-text">7p</text>
  
  

</svg>